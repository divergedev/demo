apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo-bank
  labels:
    app: gateway
    diverge.io/service: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        diverge.io/service: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/divergedev/demo-gateway:baseline
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: baseline
            - name: PAYMENTS_API_URL
              value: http://payments-api:8080
            - name: ACCOUNTS_API_URL
              value: http://accounts-api:8080
            - name: PAYMENTS_MODULE_URL
              value: http://payments-module:8080
            - name: DIVERGE_HEADER_KEY
              value: x-preview-id
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo-bank
  labels:
    app: gateway
    diverge.io/service: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
---
