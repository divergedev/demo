# Simulated PR #123 preview — created by Diverge when a PR is opened
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: order-api-pr-123
  namespace: demo-knative
  labels:
    diverge.dev/preview: "true"
    diverge.dev/pr: "123"
    diverge.dev/service: "order-api"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - image: ghcr.io/divergedev/demo-payments-api:arm64
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "pr-123-fix-order-validation"
        - name: SERVICE_NAME
          value: "order-api"
