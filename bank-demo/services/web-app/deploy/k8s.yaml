apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: demo-bank
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: ghcr.io/divergedev/demo-web-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: baseline
            - name: GATEWAY_URL
              value: http://gateway:8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: demo-bank
spec:
  selector:
    app: web-app
  ports:
    - port: 8080
      targetPort: 8080
