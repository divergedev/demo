apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo-bank
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/divergedev/demo-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: baseline
            - name: PAYMENTS_API_URL
              value: http://payments-api:8080
            - name: ACCOUNTS_API_URL
              value: http://accounts-api:8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo-bank
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
