apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo-bank
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: ghcr.io/divergedev/demo-payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: baseline
            - name: ACCOUNTS_API_URL
              value: http://accounts-api:8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: demo-bank
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
      targetPort: 8080
