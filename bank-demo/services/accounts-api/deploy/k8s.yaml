apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: demo-bank
  labels:
    app: accounts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-api
  template:
    metadata:
      labels:
        app: accounts-api
    spec:
      containers:
        - name: accounts-api
          image: ghcr.io/divergedev/demo-accounts-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: baseline
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-api
  namespace: demo-bank
spec:
  selector:
    app: accounts-api
  ports:
    - port: 8080
      targetPort: 8080
